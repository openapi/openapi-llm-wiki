name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build release bundle
        run: |
          ./scripts/build-llms.sh
          zip -r "openapi-llm-wiki-${GITHUB_REF_NAME}.zip" knowledge llms.txt llms-full.txt README.md LICENSE

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "openapi-llm-wiki-${GITHUB_REF_NAME}.zip" llms-full.txt \
            --title "$GITHUB_REF_NAME" --generate-notes
